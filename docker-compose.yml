services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: image_user
      POSTGRES_PASSWORD: image_pass
      POSTGRES_DB: image_relevance
    ports:
      - "5432:5432"
    volumes:
      - image_relevance_pg_data:/var/lib/postgresql/data

volumes:
  image_relevance_pg_data:

# FlyRank Capstone - AI Image Understanding & Content Matching Engine
# Phase 4: Production Layer Complete ✅

name: flyrank-capstone-image-relevance
version: 4.0.0
phase: 4

# Run commands
run:
  command: npx tsx src/server.ts
  env_file: .env

# Seed command
seed:
  command: npx tsx scripts/seed.ts
  creates: images + posts

# Batch processing
batch:
  command: npx tsx scripts/runBatch.ts
  processes: pending images

# Test guard (no API needed)
test_guard:
  command: npx tsx scripts/testGuard.ts

# Eval Set
eval:
  path: data/eval-set.json
  precision_command: npx tsx scripts/computePrecision.ts

# Base URL for API
base_url: http://localhost:3000

# Endpoints to probe
endpoints:
  health:
    path: /health
    method: GET
    expected_status: 200

  images_batch:
    path: /api/images/batch-process
    method: POST
    expected_status: 200

  images_get:
    path: /api/images/:id
    method: GET
    expected_status: 200

  images_stats:
    path: /api/images/stats
    method: GET
    expected_status: 200

  posts_create:
    path: /api/posts
    method: POST
    expected_status: 201

  posts_matching:
    path: /api/posts/:id/images
    method: GET
    expected_status: 200

  suggestions_list:
    path: /api/suggestions
    method: GET
    expected_status: 200

# Database schema
database:
  host: localhost
  port: 5432
  name: image_relevance
  user: image_user
  password: image_pass
  migrations:
    - src/db/migrations/001_create_images.sql
    - src/db/migrations/002_create_image_embeddings.sql
    - src/db/migrations/003_create_posts.sql
    - src/db/migrations/004_create_post_embeddings.sql
    - src/db/migrations/005_create_suggestions.sql
    - src/db/migrations/006_create_cost_log.sql

# Features implemented
features:
  phase1:
    - Design document
    - Database schema (6 tables)
    - 50-image corpus
    - Sample posts
  phase2:
    - Vision pipeline with Gemini Flash
    - Structured output validation
    - Batch processing with retries
    - Cost tracking per call
    - Low-confidence flagging
    - Stale job recovery
  phase3:
    - Mismatch guard (fox/wolf/dog rejection)
    - Cosine similarity matching
    - Post creation API
    - Review API (approve/reject)
    - Suggestions table
  phase4:
    - Eval set (labeled pairs)
    - Precision computation script
    - Complete documentation
    - Architecture diagram

# Status
status:
  phase1: complete
  phase2: complete
  phase3: complete
  phase4: complete

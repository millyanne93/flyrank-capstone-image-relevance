
# FlyRank Capstone - AI Image Understanding & Content Matching Engine
# Phase 3: Matching Engine & Mismatch Guard (In Progress)

name: flyrank-capstone-image-relevance
version: 3.0.0
phase: 3

# Run commands
run:
  command: npx tsx src/server.ts
  env_file: .env

# Seed command
seed:
  command: npx tsx scripts/seed.ts
  creates: images + posts

# Batch processing
batch:
  command: npx tsx scripts/runBatch.ts
  processes: pending images

# Test guard (no API needed)
test_guard:
  command: npx tsx scripts/testGuard.ts

# Base URL for API
base_url: http://localhost:3000

# Endpoints to probe
endpoints:
  health:
    path: /health
    method: GET
    expected_status: 200

  images_batch:
    path: /api/images/batch-process
    method: POST
    expected_status: 200

  images_get:
    path: /api/images/:id
    method: GET
    expected_status: 200

  images_stats:
    path: /api/images/stats
    method: GET
    expected_status: 200

  posts_create:
    path: /api/posts
    method: POST
    expected_status: 201

  posts_matching:
    path: /api/posts/:id/images
    method: GET
    expected_status: 200

  suggestions_list:
    path: /api/suggestions
    method: GET
    expected_status: 200

# Status
status:
  phase1: complete
  phase2: complete
  phase3: in_progress
  phase4: not_started
